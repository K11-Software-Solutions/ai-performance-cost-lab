name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8

jobs:
  tests:
    name: Model, app, simulator, metrics and gate tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --junitxml=reports/junit.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

  perf-gates:
    name: Performance and cost gates + negative controls
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load scenarios, SLOs, budgets and baseline regression check
        run: python -m evals.run_perf_evals
      - name: Publish report to the job summary
        if: always()
        run: cat evals/results/perf_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Negative controls (each bad change MUST fail the gate)
        run: |
          for v in prompt-bloat all-large slow-model immediate-retry short-answers; do
            if PERF_VARIANT=$v python -m evals.run_perf_evals --out /tmp/neg > /dev/null 2>&1; then
              echo "::error::The gate passed the '$v' change. The gate is broken."
              exit 1
            fi
            echo "Gate correctly rejected: $v"
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: evals/results/

  experiments:
    name: Experiments are reproducible
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-run all four experiments
        run: python -m experiments.run_experiments > /dev/null
      - name: Results must match the committed ones
        run: |
          if ! git diff --exit-code -- experiments/results/; then
            echo "::error::Experiment results differ from the committed ones. Re-run and commit them, and update any article that quotes them."
            exit 1
          fi
          echo "Experiment results reproduced exactly."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: experiments/results/
